<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Student Management Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>
    <canvas id="star-canvas"></canvas>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="glass-panel" id="sidebar">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-uppercase border-bottom border-secondary">
                <i class="fa-solid fa-graduation-cap me-2 text-info"></i>EduAdmin
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="index.html" class="list-group-item list-group-item-action bg-transparent"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                <a href="students.html" class="list-group-item list-group-item-action bg-transparent"><i class="fas fa-user-graduate me-2"></i>Students</a>
                <a href="teachers.html" class="list-group-item list-group-item-action bg-transparent"><i class="fas fa-chalkboard-teacher me-2"></i>Teachers</a>
                <a href="courses.html" class="list-group-item list-group-item-action bg-transparent"><i class="fas fa-book me-2"></i>Courses</a>
                <a href="reports.html" class="list-group-item list-group-item-action bg-transparent active"><i class="fas fa-chart-line me-2"></i>Reports</a>
                <a href="settings.html" class="list-group-item list-group-item-action bg-transparent"><i class="fas fa-cog me-2"></i>Settings</a>
            </div>
        </div>
        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg glass-panel py-3 px-4 mb-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-align-left fs-4 me-3 text-white" id="menu-toggle"></i>
                    <h2 class="fs-4 m-0 text-white">Reports</h2>
                </div>
            </nav>
            <div class="container-fluid px-4">
                <!-- Chart Row 1 -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-6">
                        <div class="card glass-card p-4 shadow-sm" style="min-height:380px;">
                            <h5 class="text-white mb-4"><i class="fas fa-chart-line me-2 text-info"></i>Monthly Enrollment Trend</h5>
                            <div class="chart-container" style="position:relative;height:280px;width:100%">
                                <canvas id="enrollmentTrendChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card glass-card p-4 shadow-sm" style="min-height:380px;">
                            <h5 class="text-white mb-4"><i class="fas fa-chart-pie me-2 text-success"></i>Course Distribution</h5>
                            <div class="chart-container" style="position:relative;height:280px;width:100%">
                                <canvas id="courseDistChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Chart Row 2 -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-8">
                        <div class="card glass-card p-4 shadow-sm" style="min-height:380px;">
                            <h5 class="text-white mb-4"><i class="fas fa-chart-area me-2 text-warning"></i>Revenue Over Time</h5>
                            <div class="chart-container" style="position:relative;height:280px;width:100%">
                                <canvas id="revenueChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card glass-card p-4 shadow-sm" style="min-height:380px;">
                            <h5 class="text-white mb-4"><i class="fas fa-chart-bar me-2 text-danger"></i>Pass / Fail Rate</h5>
                            <div class="chart-container" style="position:relative;height:280px;width:100%">
                                <canvas id="passFailChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
